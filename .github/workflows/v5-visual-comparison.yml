name: V5 iPhone Visual Comparison (synthetic fixtures)

on:
  pull_request:
    paths:
      - 'avatar-body-rig-v5.js'
      - 'avatar-natural-v4.js'
      - 'avatar-v2.js'
      - 'tests/v5-visual-compare.mjs'
      - '.github/workflows/v5-visual-comparison.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render 390x844 at devicePixelRatio 3
        env:
          V5_BASE_REF: origin/feat/v5-cutout-fit-measurements-20261105
          V5_SCREENSHOT_DIR: artifacts/v5-visual
        run: node tests/v5-visual-compare.mjs
      - name: Upload Before/After PNGs to PR workflow
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-iphone-390x844-dpr3
          path: artifacts/v5-visual/
          if-no-files-found: warn
          retention-days: 30
